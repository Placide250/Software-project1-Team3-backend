openapi: 3.0.3
info:
  title: Planetarium API
  version: 1.0.0
  description: REST API for the Planetarium ticketing and event management system.

servers:
  - url: /planetapi

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer

  schemas:
    UserInfo:
      type: object
      properties:
        id:
          type: integer
        email:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        token:
          type: string
        isAdmin:
          type: boolean

    User:
      type: object
      properties:
        id:
          type: integer
        email:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        isAdmin:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Event:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: string
        price:
          type: number
          format: float
        slots:
          type: array
          items:
            $ref: '#/components/schemas/Slot'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Slot:
      type: object
      properties:
        id:
          type: integer
        datetime:
          type: string
          format: date-time
        eventId:
          type: integer
        event:
          $ref: '#/components/schemas/Event'
        tickets:
          type: array
          items:
            $ref: '#/components/schemas/Ticket'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Ticket:
      type: object
      properties:
        id:
          type: integer
        seat:
          type: string
        isWheelchair:
          type: boolean
        orderId:
          type: integer
        slotId:
          type: integer
        archivedPrice:
          type: number
          format: float
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Payment:
      type: object
      properties:
        id:
          type: integer
        orderId:
          type: integer
        paymentMethod:
          type: string
          enum: [credit_card, paypal, google_pay, apple_pay]
        status:
          type: string
          enum: [processing, complete, failed, cancelled]
        amount:
          type: number
          format: float
        cardName:
          type: string
          nullable: true
        cardNumber:
          type: string
          nullable: true
        expirationMonth:
          type: string
          nullable: true
        expirationYear:
          type: string
          nullable: true
        thirdPartyPaymentToken:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Order:
      type: object
      properties:
        id:
          type: integer
        userId:
          type: integer
          nullable: true
        slotId:
          type: integer
        childCount:
          type: integer
        guestEmail:
          type: string
          nullable: true
        user:
          $ref: '#/components/schemas/User'
        tickets:
          type: array
          items:
            $ref: '#/components/schemas/Ticket'
        payment:
          $ref: '#/components/schemas/Payment'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    OrderCreatedResponse:
      type: object
      properties:
        order:
          $ref: '#/components/schemas/Order'
        tickets:
          type: array
          items:
            $ref: '#/components/schemas/Ticket'
        payment:
          $ref: '#/components/schemas/Payment'

    ErrorResponse:
      type: object
      properties:
        message:
          type: string

    MessageResponse:
      type: object
      properties:
        message:
          type: string

paths:

  # ─────────────────────────────────────────────
  # AUTH
  # ─────────────────────────────────────────────

  /login:
    post:
      tags: [Auth]
      summary: Login
      description: Authenticates a user with email and password, creates a session, and returns a bearer token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  example: user@example.com
                password:
                  type: string
                  example: mypassword123
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserInfo'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /logout:
    post:
      tags: [Auth]
      summary: Logout
      description: Destroys the current session associated with the bearer token. Fails silently if token is invalid or missing.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Logged out (no body)

  # ─────────────────────────────────────────────
  # USERS
  # ─────────────────────────────────────────────

  /users/:
    post:
      tags: [Users]
      summary: Register a new user
      description: Creates a new user account and immediately returns a session token. Email must be unique.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [firstName, lastName, email, password]
              properties:
                firstName:
                  type: string
                  example: Jane
                lastName:
                  type: string
                  example: Doe
                email:
                  type: string
                  example: jane@example.com
                password:
                  type: string
                  example: securepassword
                isAdmin:
                  type: boolean
                  example: false
      responses:
        '200':
          description: User created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserInfo'
        '400':
          description: Missing required field or email already in use
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    get:
      tags: [Users]
      summary: Get all users
      parameters:
        - in: query
          name: id
          schema:
            type: string
          description: Optional partial ID filter
      responses:
        '200':
          description: List of users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    delete:
      tags: [Users]
      summary: Delete all users
      security:
        - BearerAuth: []
      responses:
        '200':
          description: All users deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '401':
          description: Unauthorized
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /users/{id}:
    get:
      tags: [Users]
      summary: Get a user by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: User found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    put:
      tags: [Users]
      summary: Update a user by ID
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                firstName:
                  type: string
                lastName:
                  type: string
                email:
                  type: string
                isAdmin:
                  type: boolean
      responses:
        '200':
          description: Update result (check message)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '401':
          description: Unauthorized
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    delete:
      tags: [Users]
      summary: Delete a user by ID
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Delete result (check message)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '401':
          description: Unauthorized
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ─────────────────────────────────────────────
  # EVENTS
  # ─────────────────────────────────────────────

  /events/:
    post:
      tags: [Events]
      summary: Create an event
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, description, price]
              properties:
                name:
                  type: string
                  example: Stars & Beyond
                description:
                  type: string
                  example: A journey through the cosmos.
                price:
                  type: number
                  format: float
                  minimum: 0
                  example: 12.50
      responses:
        '200':
          description: Event created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
        '400':
          description: Missing or invalid field
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    get:
      tags: [Events]
      summary: Get all events
      description: Returns all events sorted by name ascending. Each event includes nested slots (sorted by datetime ascending) and tickets.
      parameters:
        - in: query
          name: eventId
          schema:
            type: string
          description: Optional partial ID filter
      responses:
        '200':
          description: List of events with slots and tickets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Event'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    delete:
      tags: [Events]
      summary: Delete all events
      responses:
        '200':
          description: All events deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /events/{id}:
    get:
      tags: [Events]
      summary: Get an event by ID
      description: Returns event with nested slots (sorted by datetime ascending) and tickets.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Event found
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Event'
        '404':
          description: Event not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    put:
      tags: [Events]
      summary: Update an event by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, description, price]
              properties:
                name:
                  type: string
                description:
                  type: string
                price:
                  type: number
                  format: float
                  minimum: 0
      responses:
        '200':
          description: Update result (check message)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          description: Missing or invalid field
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    delete:
      tags: [Events]
      summary: Delete an event by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Delete result (check message)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ─────────────────────────────────────────────
  # SLOTS
  # ─────────────────────────────────────────────

  /slots:
    get:
      tags: [Slots]
      summary: Get all slots
      description: Returns all slots sorted by datetime ascending, with nested event, tickets, orders, and users.
      parameters:
        - in: query
          name: slotId
          schema:
            type: string
          description: Optional partial ID filter
      responses:
        '200':
          description: List of slots
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Slot'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    delete:
      tags: [Slots]
      summary: Delete all slots
      responses:
        '200':
          description: All slots deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /slots/{id}:
    get:
      tags: [Slots]
      summary: Get a slot by ID
      description: Returns the slot with nested event, tickets, orders, and users.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Slot found
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Slot'
        '404':
          description: Slot not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    put:
      tags: [Slots]
      summary: Update a slot by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                datetime:
                  type: string
                  format: date-time
                  example: '2025-09-15T14:00:00Z'
      responses:
        '200':
          description: Update result (check message)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '409':
          description: Scheduling conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    delete:
      tags: [Slots]
      summary: Delete a slot by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Delete result (check message)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /events/{eventId}/slots:
    get:
      tags: [Slots]
      summary: Get all slots for an event
      parameters:
        - in: path
          name: eventId
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: List of slots for the event
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Slot'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    post:
      tags: [Slots]
      summary: Create a slot for an event
      parameters:
        - in: path
          name: eventId
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [datetime]
              properties:
                datetime:
                  type: string
                  format: date-time
                  example: '2025-09-15T14:00:00Z'
      responses:
        '200':
          description: Slot created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Slot'
        '400':
          description: Missing or invalid field
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Event not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Scheduling conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /events/{eventId}/slots/recurring:
    post:
      tags: [Slots]
      summary: Create recurring slots for an event
      description: |
        Bulk-creates slots on a recurring schedule within a date range.
        Each date in the range is combined with each time in `times` to produce a slot.
        Maximum of 500 total slots per request.
      parameters:
        - in: path
          name: eventId
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [frequency, startDate, endDate, times]
              properties:
                frequency:
                  type: string
                  enum: [daily, weekly, biweekly, monthly]
                  example: weekly
                startDate:
                  type: string
                  format: date
                  example: '2025-09-01'
                endDate:
                  type: string
                  format: date
                  example: '2025-12-31'
                times:
                  type: array
                  items:
                    type: string
                    pattern: '^([01]\d|2[0-3]):([0-5]\d)$'
                  description: One or more 24-hour HH:mm time strings
                  example: ['10:00', '14:00', '18:00']
      responses:
        '200':
          description: Recurring slots created
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Slot'
        '400':
          description: Missing/invalid field, date range issue, or slot limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Event not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Scheduling conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ─────────────────────────────────────────────
  # ORDERS
  # ─────────────────────────────────────────────

  /events/{eventId}/slots/{slotId}/orders:
    post:
      tags: [Orders]
      summary: Create an order
      description: |
        Places a ticket order for a specific event slot. Can be made by an authenticated user
        (via bearer token) or a guest (via `guestEmail`). At least one of the two must be present.

        Payment amount is calculated as: `event.price × (selectedSeats.length − childCount)`.
        Children ride free — childCount reduces the billable seat count but does not reduce seat reservations.

        All seat reservations and payment recording occur in a single database transaction.
      security:
        - BearerAuth: []
        - {}
      parameters:
        - in: path
          name: eventId
          required: true
          schema:
            type: integer
        - in: path
          name: slotId
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [selectedSeats, childCount, paymentMethod]
              properties:
                selectedSeats:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [seat]
                    properties:
                      seat:
                        type: string
                        description: Seat identifier (e.g. "A1", "B12")
                        example: A1
                      isWheelchair:
                        type: boolean
                        example: false
                childCount:
                  type: integer
                  minimum: 0
                  description: Number of children in the party (free admission, reduces billable count)
                  example: 1
                guestEmail:
                  type: string
                  description: Required if not authenticated
                  example: guest@example.com
                paymentMethod:
                  type: string
                  enum: [credit_card, paypal, google_pay, apple_pay]
                  example: credit_card
                paymentToken:
                  type: string
                  description: Token for PayPal, Google Pay, or Apple Pay
                  example: tok_abc123
                cardName:
                  type: string
                  description: Required if paymentMethod is credit_card
                  example: Jane Doe
                cardNumber:
                  type: string
                  description: Required if paymentMethod is credit_card
                  example: '4111111111111111'
                expirationMonth:
                  type: string
                  description: Required if paymentMethod is credit_card
                  example: '09'
                expirationYear:
                  type: string
                  description: Required if paymentMethod is credit_card
                  example: '2028'
      responses:
        '200':
          description: Order created with tickets and payment record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderCreatedResponse'
        '400':
          description: Missing/invalid field, no seats selected, invalid payment method, or missing credit card info
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Event or slot not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: One or more selected seats are already reserved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /orders/:
    get:
      tags: [Orders]
      summary: Get all orders
      description: Returns all orders sorted by createdAt descending, with payment, user, tickets, slots, and events included.
      parameters:
        - in: query
          name: orderId
          schema:
            type: string
          description: Optional partial ID filter
      responses:
        '200':
          description: List of orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Order'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    delete:
      tags: [Orders]
      summary: Delete all orders
      responses:
        '200':
          description: All orders deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /orders/email:
    get:
      tags: [Orders]
      summary: Get orders by email
      description: |
        Returns all orders matching the given email address — checks both `guestEmail`
        and orders belonging to a registered user with that email.
      parameters:
        - in: query
          name: email
          required: true
          schema:
            type: string
          example: guest@example.com
      responses:
        '200':
          description: List of matching orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Order'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /orders/user/current:
    get:
      tags: [Orders]
      summary: Get orders for the currently authenticated user
      description: Requires a valid bearer token. Returns all orders belonging to the authenticated user.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: List of orders for the current user
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Order'
        '401':
          description: Not authenticated
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /orders/user/{userId}:
    get:
      tags: [Orders]
      summary: Get orders for a specific user by ID
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: List of orders for the user
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Order'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /orders/{id}:
    get:
      tags: [Orders]
      summary: Get an order by ID
      description: Returns the order with full nested data including all tickets for the slot (to show seat availability context).
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Order found
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Order'
        '404':
          description: Order not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    delete:
      tags: [Orders]
      summary: Delete an order by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Delete result (check message)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
